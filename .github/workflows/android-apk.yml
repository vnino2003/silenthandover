# Builds a TEST (debug-signed) Android APK of the Silent Handover app and uploads it as a
# downloadable artifact. It is not a release build: it is signed with the Android debug key and is
# meant for installing on test phones. A signed release (APK/AAB) needs a keystore in GitHub
# Secrets and a protected environment; see docs/android.md.
#
# Triggers: manually (Actions -> Android APK -> Run workflow, optionally with an API address),
# a pushed tag like v1.2.0, or a push to master that changes the app.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "HTTPS address of the API the app should use (blank = repository variable ANDROID_API_URL, or set it in the app)"
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: [master]
    paths:
      - "frontend/**"
      - "packages/shared/**"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  # Write access only to publish the APK to the public "android-latest" release.
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_URL: ${{ inputs.api_url || vars.ANDROID_API_URL || '' }}
    steps:
      - uses: actions/checkout@v5

      # Capacitor 8 needs Node 22+.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Android Gradle Plugin 8.13 needs JDK 17+; Temurin 21 is used.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Installs Gradle 8.14.3 (the version the Android project asks for) with caching and retries,
      # instead of the wrapper downloading it on every run.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      # The hosted Ubuntu runner already has the Android SDK (ANDROID_HOME); Gradle downloads a
      # missing platform or build tools itself, the licences being accepted on the runner.
      - name: Show the Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      # Without an API address the installed app cannot reach any server: it then asks the person
      # for the address on first launch. Set the repository variable ANDROID_API_URL to avoid that.
      - name: Check the API address
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning title=No API address::ANDROID_API_URL is not set, so this APK asks for the server address on first launch. Set it in Settings > Secrets and variables > Actions > Variables."
          else
            echo "API address built in: $VITE_API_URL"
          fi

      - run: npm ci
      - name: Build the web app
        run: npm run build -w frontend
      - name: Copy it into the Android project
        run: npx cap sync android
        working-directory: frontend
      - name: Assemble the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: frontend/android

      - name: Name the APK
        id: name
        run: |
          short=$(git rev-parse --short HEAD)
          out="silent-handover-test-${short}.apk"
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "API address built in: ${VITE_API_URL:-none (enter it in the app)}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: silent-handover-test-apk
          path: ${{ steps.name.outputs.file }}
          retention-days: 30
          if-no-files-found: error

      # Public, fixed download link for the sign-in page's "Download the Android app" button:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/silent-handover.apk
      # Updated by master pushes, tags and manual runs (Actions artifacts need a GitHub sign-in).
      - name: Publish to the android-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.name.outputs.file }}" silent-handover.apk
          notes="Test build (debug-signed) of commit ${GITHUB_SHA::7}, built $(date -u +'%Y-%m-%d %H:%M UTC'). Install on Android 7 or newer; allow installing from your browser when asked."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest --title "Silent Handover for Android (test build)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload android-latest silent-handover.apk --clobber
