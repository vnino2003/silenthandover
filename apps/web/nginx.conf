# Serves the built web app. Every page path falls back to index.html (the app routes itself).
# HTTPS is handled in front of this container (Coolify's proxy, or Caddy/nginx on the VPS).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Built files have a content hash in their name, so they can be cached for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-Frame-Options "DENY";
    try_files $uri $uri/ /index.html;
  }
}
